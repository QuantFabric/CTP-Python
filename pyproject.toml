[build-system]
requires = ["scikit-build-core>=0.10", "swig>=4.2"]
build-backend = "scikit_build_core.build"

[project]
name = "ctp_wrap"
version = "6.7.13"
description = "Python wrapper for CTP API using SWIG"
requires-python = ">=3.8"

[tool.scikit-build]
cmake.build-type = "Release"
minimum-version = "0.10"
build-dir = "build/{wheel_tag}"